name: 코드 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · 타입 · 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: 의존성 설치
        run: bun install --frozen-lockfile
      - name: 코드 규칙 검사
        run: bun run lint
      - name: 타입 검사
        run: bun run typecheck
      - name: 단위·컴포넌트 테스트
        run: bun run test
